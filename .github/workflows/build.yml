name: Build binaries

# Builds prrit + git-remote-prrit for every distribution target and uploads
# one artifact per target (archive + sha256). CI calls it to prove the release
# profile and every target still build; the release workflow calls it to get
# the files it attaches to the GitHub release.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the calling commit)
        required: false
        type: string
        default: ""
      retention-days:
        description: How long to keep the artifacts
        required: false
        type: number
        default: 1

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          set -euo pipefail
          archive="prrit-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)/prrit-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/prrit" "target/${{ matrix.target }}/release/git-remote-prrit" README.md LICENSE "$staging/"
          tar -C "$(dirname "$staging")" -czf "$archive" "$(basename "$staging")"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
